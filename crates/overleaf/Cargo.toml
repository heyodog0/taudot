[package]
name = "overleaf"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "Overleaf real-time protocol client (socket.io 0.9) for taudot"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = "2"
sha1 = "0.10"
tracing = "0.1"
ot = { package = "ot2", path = "../ot2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
overleaf = { path = ".", features = ["fake"] }

[features]
# A fake real-time server for tests, used by this crate's tests and the engine's.
fake = ["dep:ot"]
