<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Review layouts</title>
<style>
  :root {
    --bg: #0b0b0c; --panel: #151517; --panel2: #1c1c1f; --line: #26262a; --text: #c9c9cc; --dim: #6b6b72;
    --num: #4a4a52; --kw: #80a0ff; --str: #8cc85f; --cmt: #6b6b72; --sel: #1d2233;
    --ada: #5b8def; --grace: #e0874a; --you: #f2a03d; --add: #2f4a2a; --addtx: #9fd68a; --del: #4a2a2a; --deltx: #e08a8a;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    --mono: "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; }
  .win { width: 1440px; height: 900px; background: var(--bg); color: var(--text); font: 13px/1 var(--ui);
    display: grid; grid-template-rows: 38px 1fr 26px; overflow: hidden; border-radius: 10px; }
  .title { display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #121214; border-bottom: 1px solid var(--line); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #3a3a3f; }
  .title .name { margin-left: 14px; color: var(--dim); font-weight: 600; }
  .title .lbl { margin-left: auto; color: var(--dim); font-size: 12px; }
  .status { display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #0f0f11; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .status .g { width: 8px; height: 8px; border-radius: 50%; background: #3fbf6f; }
  .body { display: grid; min-height: 0; }
  .ed { position: relative; overflow: hidden; font: 14px/22px var(--mono); padding-top: 14px; }
  .ln { display: flex; height: 22px; white-space: pre; position: relative; }
  .ln .n { width: 46px; text-align: right; padding-right: 14px; color: var(--num); flex: none; }
  .ln .t { flex: 1; overflow: hidden; }
  .k { color: var(--kw); } .c { color: var(--cmt); font-style: italic; } .s { color: var(--str); }
  .hl-ada { background: rgba(91,141,239,.18); border-bottom: 2px solid rgba(91,141,239,.6); }
  .hl-grace { background: rgba(224,135,74,.16); border-bottom: 2px solid rgba(224,135,74,.6); }
  .ins { background: var(--add); color: var(--addtx); }
  .delt { color: var(--deltx); text-decoration: line-through; background: var(--del); }
  .cur { background: var(--sel); }
  .pdf { background: #1a1a1d; border-left: 1px solid var(--line); padding: 22px; overflow: hidden; }
  .page { background: #fff; width: 100%; height: 820px; border-radius: 2px; box-shadow: 0 6px 24px rgba(0,0,0,.5); padding: 54px 46px;
    color: #222; font: 11px/1.45 "Times New Roman", serif; }
  .page h1 { font-size: 19px; text-align: center; margin: 0 0 6px; font-weight: normal; }
  .page .au { text-align: center; margin-bottom: 20px; }
  .page h2 { font-size: 13px; margin: 14px 0 6px; }
  .page p { margin: 0 0 8px; text-align: justify; }
  .bar { height: 7px; background: #e9e9ec; border-radius: 2px; margin: 0 0 6px; }
  /* cards */
  .card { background: var(--panel2); border: 1px solid #2a2a2f; border-radius: 10px; padding: 11px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .card.sel { border-color: #3d5a9a; box-shadow: 0 0 0 1px #3d5a9a, 0 8px 22px rgba(0,0,0,.5); }
  .who { display: flex; align-items: center; gap: 8px; }
  .av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; flex: none; }
  .nm { font-weight: 600; color: #e6e6e9; } .tm { color: var(--dim); font-size: 12px; }
  .q { margin: 8px 0 6px; padding-left: 8px; border-left: 2px solid currentColor; color: var(--dim); font-style: italic; font-size: 12px; }
  .msg { color: #d6d6da; line-height: 1.4; }
  .rep { color: var(--dim); font-size: 12px; margin-top: 8px; }
  .acts { margin-left: auto; display: flex; gap: 10px; color: var(--dim); font-size: 13px; }
  .reply { margin-top: 10px; height: 32px; border: 1px solid #3a3a40; border-radius: 8px; display: flex; align-items: center; padding: 0 10px; color: var(--dim); }
  .sub { padding-left: 32px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px; background: #222226; color: #cfcfd3; font-size: 12px; }
  svg.conn { position: absolute; inset: 0; pointer-events: none; }
  .cap { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font: 600 13px var(--ui); color: #9a9aa2; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'a';
const L = [
  ['', '<span class="k">\\documentclass</span>{article}'],
  ['', '<span class="k">\\usepackage</span>{amsmath}'],
  ['', '<span class="k">\\title</span>{Counting Paths in a Grid}'],
  ['', '<span class="k">\\author</span>{You and Ada}'],
  ['', ''],
  ['', '<span class="k">\\begin</span>{document}'],
  ['', '<span class="k">\\maketitle</span>'],
  ['', ''],
  ['', '<span class="k">\\section</span>{Introduction}'],
  ['', 'We study a simple problem about counting paths in a grid.'],
  ['ada', 'The answer is a <span class="hl-ada">binomial coefficient</span>, which we prove in two ways.'],
  ['grace', 'Both proofs are short, and <span class="hl-grace">each says something</span> the other doesn\'t.'],
  ['', ''],
  ['', '<span class="k">\\section</span>{Result}'],
  ['cur', 'For every $n$ the number of monotone paths is $\\binom{2n}{n}$<span class="ins"> (a Dyck-free count)</span>.'],
  ['', 'The first proof is a bijection with words over two letters.'],
  ['', 'The second proof uses generating functions.'],
  ['', ''],
  ['', '<span class="k">\\section</span>{The bijection}'],
  ['ada2', 'A monotone path from $(0,0)$ to $(n,n)$ takes $2n$ <span class="hl-ada">unit steps</span>.'],
  ['', 'Write R for a step right and U for a step up.'],
  ['', 'Each path gives a word with $n$ letters R and $n$ letters U<span class="delt">, and each such word gives a path</span>.'],
  ['', 'There are $\\binom{2n}{n}$ such words.'],
  ['', ''],
  ['', '<span class="k">\\section</span>{Generating functions}'],
  ['', 'Let $p_{a,b}$ be the number of paths to $(a,b)$.'],
  ['', 'Then $p_{a,b} = p_{a-1,b} + p_{a,b-1}$ with $p_{0,0} = 1$.'],
  ['', 'So $P = 1/(1-x-y)$, and the coefficient of $x^n y^n$ is $\\binom{2n}{n}$.'],
  ['', ''],
  ['', '<span class="k">\\section</span>{Discussion}'],
  ['', 'The first proof explains the answer; the second computes it.'],
  ['', '<span class="c">% TODO: paths in d dimensions</span>'],
  ['', '<span class="k">\\end</span>{document}'],
];
const lineY = (i) => 14 + i * 22; // top of line i inside .ed
const av = (who, init) => `<div class="av" style="background:var(--${who})">${init}</div>`;
const editor = (opts = {}) => `<div class="ed" id="ed">${L.map(([m, t], i) =>
  `<div class="ln ${m === 'cur' ? 'cur' : ''}"><span class="n">${i + 1}</span><span class="t">${t}${(opts.after || {})[i] || ''}</span>${(opts.gutter || {})[i] || ''}</div>${(opts.below || {})[i] || ''}`).join('')}</div>`;
const pdf = () => `<div class="pdf"><div class="page"><h1>Counting Paths in a Grid</h1><div class="au">You and Ada</div>
  <h2>1 Introduction</h2><p>We study a simple problem about counting paths in a grid. The answer is a binomial coefficient, which we prove in two ways. Both proofs are short, and each says something the other doesn't.</p>
  <h2>2 Result</h2><p>For every n the number of monotone paths is (2n choose n) (a Dyck-free count). The first proof is a bijection with words over two letters. The second proof uses generating functions.</p>
  <h2>3 The bijection</h2><p>A monotone path from (0,0) to (n,n) takes 2n unit steps. Write R for a step right and U for a step up.</p>
  ${'<div class="bar"></div>'.repeat(14)}</div></div>`;
const cards = {
  ada: { line: 10, who: 'ada', init: 'AL', name: 'Ada Lovelace', tm: '2 hr ago', q: 'binomial coefficient', msg: 'Say which one: the central binomial coefficient.', rep: 1 },
  grace: { line: 11, who: 'grace', init: 'GH', name: 'Grace Hopper', tm: '30 min ago', q: 'each says something', msg: 'Is this true? The second proof only computes.', rep: 0 },
  ins: { line: 14, who: 'ada', init: 'AL', name: 'Ada Lovelace', tm: 'added · 10 min ago', change: '+ (a Dyck-free count)', cls: 'ins' },
  ada2: { line: 19, who: 'ada', init: 'AL', name: 'Ada Lovelace', tm: '1 day ago', q: 'unit steps', msg: 'Cite Feller here?', rep: 0 },
  del: { line: 21, who: 'grace', init: 'GH', name: 'Grace Hopper', tm: 'deleted · 4 min ago', change: '− and each such word gives a path', cls: 'delt' },
};
const cardHTML = (c, { sel = false, compact = false, reply = false } = {}) => `<div class="card ${sel ? 'sel' : ''}">
  <div class="who">${av(c.who, c.init)}<div><div class="nm">${c.name}</div><div class="tm" style="margin-top:3px">${c.tm}</div></div>
  <div class="acts">${c.change ? '<span style="color:#6fcf7f">✓</span><span style="color:#e07a7a">✕</span>' : '<span>✓</span><span>⋯</span>'}</div></div>
  ${c.change ? `<div style="margin-top:9px"><span class="${c.cls}" style="font:12.5px var(--mono);padding:1px 3px">${c.change}</span></div>` : `
  ${compact ? '' : `<div class="q" style="color:var(--${c.who})"><span style="color:var(--dim)">“${c.q}”</span></div>`}
  <div class="msg" style="${compact ? 'margin-top:8px' : ''}">${c.msg}</div>
  ${sel && c.rep ? `<div class="sub"><div class="who">${av('you', 'Y')}<div><span class="nm">You</span> <span class="tm">1 hr ago</span><div class="msg" style="margin-top:3px">Yes, (2n choose n). I'll say so.</div></div></div></div>` : (c.rep ? `<div class="rep">${c.rep} reply</div>` : '')}
  ${reply ? '<div class="reply">Reply…</div>' : ''}`}</div>`;
function conn(svgW, pairs) { // pairs: [x1,y1,x2,y2,color]
  return `<svg class="conn" width="${svgW}" height="900">${pairs.map(([x1, y1, x2, y2, c]) =>
    `<path d="M${x1} ${y1} C ${x1 + 30} ${y1}, ${x2 - 30} ${y2}, ${x2} ${y2}" stroke="${c}" stroke-opacity=".55" fill="none" stroke-width="1.5"/><circle cx="${x2}" cy="${y2}" r="3" fill="${c}"/>`).join('')}</svg>`;
}
const colors = { ada: '#5b8def', grace: '#e0874a' };
let html = '', cap = '';

if (v === 'a') {
  // A: Google Docs margin, cards aligned to lines, left of the editor
  cap = 'A · Margin cards beside their lines (Google Docs): every thread visible, cards push down when crowded';
  const W = 300, order = ['ada', 'grace', 'ins', 'ada2', 'del'];
  let y = 0, pos = {};
  for (const k of order) { const want = lineY(cards[k].line) - 6; y = Math.max(want, y); pos[k] = y; y += (k === 'ada' ? 300 : cards[k].change ? 108 : 140) + 10; }
  html = `<div class="body" style="grid-template-columns:${W}px 1fr 480px"><div style="position:relative;background:#0f0f11;border-right:1px solid var(--line)">
    ${order.map((k) => `<div style="position:absolute;left:12px;right:22px;top:${pos[k] + 14}px">${cardHTML(cards[k], { sel: k === 'ada', reply: k === 'ada' })}</div>`).join('')}
    ${conn(W, order.map((k) => [W - 22, pos[k] + 32, W, lineY(cards[k].line) + 25, colors[cards[k].who]]))}
  </div>${editor()}${pdf()}</div>`;
} else if (v === 'b') {
  // B: avatars in a slim rail; the selected thread opens as a floating card over the text
  cap = 'B · Slim rail of avatars on each commented line; the selected thread opens as a floating card';
  const rail = (k) => `<div style="position:absolute;left:10px;top:${lineY(cards[k].line) + 11}px">${av(cards[k].who, cards[k].init)}</div>`;
  html = `<div class="body" style="grid-template-columns:46px 1fr 480px"><div style="position:relative;background:#0f0f11;border-right:1px solid var(--line)">
    ${['ada', 'grace', 'ins', 'ada2', 'del'].map(rail).join('')}
    <div style="position:absolute;left:3px;top:${lineY(10) + 6}px;width:40px;height:34px;border-radius:10px;border:1.5px solid #3d5a9a"></div></div>
    <div style="position:relative">${editor()}
      <div style="position:absolute;left:330px;top:${lineY(10) + 36}px;width:380px">${cardHTML(cards.ada, { sel: true, reply: true })}</div>
    </div>${pdf()}</div>`;
} else if (v === 'c') {
  // C: threads inline under their line (GitHub review), editor text pushed down
  cap = 'C · Threads open inline under their line (code review style); markers in the gutter';
  const inline = (k) => `<div style="margin:4px 16px 8px 60px;max-width:620px">${cardHTML(cards[k], { sel: k === 'ada', reply: k === 'ada', compact: true })}</div>`;
  const g = (k) => `<span style="position:absolute;left:4px;top:4px;width:6px;height:14px;border-radius:3px;background:${colors[cards[k].who]}"></span>`;
  html = `<div class="body" style="grid-template-columns:1fr 520px">${editor({
    below: { 10: inline('ada') },
    gutter: { 10: g('ada'), 11: g('grace'), 19: g('ada2') },
    after: { 11: ' <span class="chip">' + av('grace', 'GH').replace('24px;height:24px', '16px;height:16px') + ' 1</span>', 19: ' <span class="chip">💬 1</span>' },
  })}${pdf()}</div>`;
} else if (v === 'd') {
  // D: Overleaf-style review panel: a list, not aligned, with tabs and filters
  cap = 'D · Review panel as a list (Overleaf): tabs, filters, grouped by file; click jumps to the text';
  html = `<div class="body" style="grid-template-columns:340px 1fr 460px"><div style="background:#0f0f11;border-right:1px solid var(--line);padding:12px;overflow:hidden">
    <div style="display:flex;gap:6px;margin-bottom:12px"><span class="chip" style="background:#2a3550;color:#dbe4ff">All 5</span><span class="chip">Comments 3</span><span class="chip">Changes 2</span><span class="chip" style="margin-left:auto">Resolved</span></div>
    <div class="tm" style="margin:4px 2px 8px;font-weight:600;letter-spacing:.04em">MAIN.TEX</div>
    ${['ada', 'grace', 'ins', 'ada2', 'del'].map((k) => `<div style="margin-bottom:10px">${cardHTML(cards[k], { sel: k === 'ada', compact: false })}</div>`).join('')}
  </div>${editor()}${pdf()}</div>`;
} else if (v === 'e') {
  // E: minimal: underlines + inline end-of-line ghost text; a card pops on hover/cursor (no margin at all)
  cap = 'E · No margin: highlighted text and a quiet end-of-line note; the card pops up at the cursor';
  const ghost = (who, txt) => `  <span style="font:12px var(--ui);color:var(--dim)"><span style="color:${colors[who]}">●</span> ${txt}</span>`;
  html = `<div class="body" style="grid-template-columns:1fr 520px"><div style="position:relative">${editor({
    after: { 10: ghost('ada', 'Ada: Say which one… (+1)'), 11: ghost('grace', 'Grace: Is this true?'), 19: ghost('ada', 'Ada: Cite Feller here?') },
  })}<div style="position:absolute;left:230px;top:${lineY(14) + 38}px;width:360px">${cardHTML(cards.ins, { sel: true })}</div></div>${pdf()}</div>`;
} else if (v === 'f1' || v === 'f2') {
  // F: adding a comment. f1: text selected, a Comment button appears next to the selection. f2: the draft card.
  const selStyle = v === 'f1' ? 'background:rgba(120,140,200,.35)' : 'background:rgba(242,160,61,.22);border-bottom:2px solid rgba(242,160,61,.75)';
  L[15][1] = `The first proof is a <span style="${selStyle}">bijection with words over two letters.</span>`;
  L[16][1] = `<span style="${selStyle}">The second proof uses generating functions</span>.`;
  L[14][0] = ''; // no cursor-line band
  const W = 300;
  const tops = v === 'f1' ? { ada: lineY(10) + 8, grace: lineY(10) + 140 } : { ada: lineY(10) - 150, grace: lineY(10) - 30 };
  const marginCards = ['ada', 'grace'].map((k) => `<div style="position:absolute;left:12px;right:22px;top:${tops[k]}px;opacity:${v === 'f2' ? .5 : 1}">${cardHTML(cards[k], { compact: true })}</div>`).join('');
  const pill = `<div style="position:absolute;left:${48 + 47 * 8.43}px;top:${lineY(16) + 30}px;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-radius:9px;background:#2b2b31;border:1px solid #3d3d45;box-shadow:0 8px 24px rgba(0,0,0,.55);font:600 13px var(--ui);color:#e8e8ec">
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 3.5h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H7l-3 2.5V11.5H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z" fill="none" stroke="#8fb0ff" stroke-width="1.4"/><path d="M8 5.5v4M6 7.5h4" stroke="#8fb0ff" stroke-width="1.4"/></svg>
      Comment <span style="font-weight:500;color:#8a8a93;margin-left:4px">⌥⌘M</span></div>`;
  const draft = `<div class="card sel" style="position:absolute;left:12px;right:22px;top:${lineY(15) - 4}px;border-color:#8a6a3a;box-shadow:0 0 0 1px #8a6a3a,0 10px 28px rgba(0,0,0,.55)">
      <div class="who">${av('you', 'Y').replace('24px;height:24px', '22px;height:22px')}<div class="nm">You</div><div class="tm" style="margin-left:6px">new comment</div></div>
      <div class="q" style="color:var(--you)"><span style="color:#b9b9c0">“bijection with words over two letters. The second proof uses generating functions”</span></div>
      <div style="margin-top:8px;min-height:60px;border:1.5px solid #4d7cf0;border-radius:8px;padding:9px 10px;color:#e6e6e9;line-height:1.4">Does the bijection need the reflection argument here?<span style="display:inline-block;width:1.5px;height:15px;background:#8fb0ff;vertical-align:-2px;margin-left:1px"></span></div>
      <div class="tm" style="margin-top:8px">↩ send · ⇧↩ new line · esc cancel</div>
      <div style="display:flex;align-items:center;margin-top:10px;gap:8px">
        <span style="margin-left:auto;padding:6px 11px;border-radius:7px;color:#cfcfd4;font-weight:600">Cancel</span>
        <span style="padding:6px 13px;border-radius:7px;background:#3d6ef0;color:#fff;font-weight:600">Comment</span></div></div>`;
  const connLine = v === 'f2' ? conn(W, [[W - 22, lineY(15) + 20, W, lineY(15) + 25, '#f2a03d']]) : '';
  cap = v === 'f1' ? 'F1 · Select text: a Comment button appears right at the selection (or ⌥⌘M, or &lt;leader&gt;ac)'
                   : 'F2 · The draft opens beside the selection, quoting it; the selection stays marked; Return sends';
  html = `<div class="body" style="grid-template-columns:${W}px 1fr 480px"><div style="position:relative;background:#0f0f11;border-right:1px solid var(--line)">
    ${marginCards}${v === 'f2' ? draft : ''}${connLine}</div>
    <div style="position:relative">${editor()}${v === 'f1' ? pill : ''}</div>${pdf()}</div>`;
}
document.getElementById('root').innerHTML = `<div class="win"><div class="title"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
  <span class="name">counting-paths — main.tex</span><span class="lbl">Layout ${v.toUpperCase()}</span></div>${html}
  <div class="status"><span class="g"></span> online · with Ada Lovelace, Grace Hopper<span style="margin-left:auto">2 pages · typeset in 38 ms</span></div></div>
  <div class="cap" style="position:fixed;bottom:auto;top:908px">${cap}</div>`;
</script>
</body>
</html>
